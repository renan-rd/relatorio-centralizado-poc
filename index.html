<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Centralizador — protótipo</title>
    <meta
      name="description"
      content="Réplica estática dos relatórios de captação e e-mail do Centralizador, para testes com usuários."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="af-reports">
      <nav class="af-reports__nav" aria-label="Relatórios">
        <div class="af-reports__heading">Relatórios</div>
        <div class="af-reports__label">Captação</div>
        <button
          type="button"
          class="af-reports__item"
          data-report="captacao"
          aria-current="page"
        >
          Como está a captação
        </button>
        <button type="button" class="af-reports__item" data-report="emails">
          Como foram os e-mails
        </button>
      </nav>

      <div class="af-reports__content">
        <header class="page-header">
          <h1 class="page-header__title" id="page-title">Como está a captação</h1>
        </header>

        <div class="period-row" id="period-row" data-testid="period-picker"></div>

        <div class="af-panel-blocks" id="panel-content"></div>

        <footer class="poc-footer">
          <span>
            <strong>Protótipo para testes com usuários.</strong> Dados
            sintéticos, sem conexão com a conta.
          </span>
          <span id="poc-scenario-controls">
            <span id="poc-scenario"></span>
            <button type="button" id="poc-scenario-toggle">
              Simular conta sem Google Analytics
            </button>
          </span>
        </footer>
      </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/charts.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
